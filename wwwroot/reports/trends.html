<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>OpenRMF OSS Vulnerability Trends</title>
	<meta name="description" content="OpenRMF Vulnerability Trends over Time">
	<meta name="referrer" content="origin">

	<!-- Favicon -->
	<link rel="shortcut icon" href="/assets/images/favicon-32.png" type="image/png">

	<!-- Bootstrap CSS -->
	<link href="/assets/css/bootstrap.min.css" rel="stylesheet" type="text/css" />

	<!-- Font Awesome CSS -->
	<link href="/assets/font-awesome/css/font-awesome.min.css" rel="stylesheet" type="text/css" />

	<!-- Custom CSS -->
	<link href="/assets/css/style.css" rel="stylesheet" type="text/css" />
	<link href="/assets/plugins/sweetalert/sweetalert.css" rel="stylesheet" type="text/css" />

</head>

<body class="adminbody">

	<script src="/assets/js/keycloak.min.js"></script>
	<script src="/js/auth.js"></script>

	<div id="main" style="display: none;">

		<!-- top bar navigation -->
		<div id="includeNavBarLink"></div>
		<!-- End Navigation -->

		<!-- Left Sidebar -->
		<div id="includeSidebarLink"></div>
		<!-- End Sidebar -->

		<div class="content-page">
			<!-- Start content -->
			<div class="content">
				<div class="container-fluid">
					<div class="row">
						<div class="col-xl-12">
							<div class="breadcrumb-holder">
								<h1 class="main-title float-left">Reports - Vulnerability Trends</h1>
								<ol class="breadcrumb float-right">
									<li class="breadcrumb-item">Reports</li>
									<li class="breadcrumb-item active">Trends</li>
								</ol>
								<div class="clearfix"></div>
							</div>
						</div>
					</div>
					<!-- end row -->
					<div class="row">
						<div class="col-xs-12 col-sm-12 col-md-12 col-lg-4 col-xl-4">
							<div class="card mb-3">
								<div class="card-header">
									<h3><i class="fa fa-filter"></i> Filters</h3>
								</div>
								<div class="card-body">
									<div>
										<form>
											<div class="form-group">
												<label class="checklistSystemsListLabel" id="checklistSystemsListLabel"
													for="checklistSystemFilter">System Package Filter</label>
												<select class="form-control" id="checklistSystemFilter">
													<option value="">[ Choose a System Package ]</option>
												</select>
												<small id="titleSystem" class="form-text text-muted">Specify the System
													Package</small>
											</div>
											<div class="form-group">
												<button type="button" title="Run the report to generate your trend charts"
													class="btn btn-sm btn-primary"
													onclick="getScanTrendReport();">Run Report</button>
											</div>
										</form>
									</div>
								</div><!-- end card body -->
							</div><!-- end card-->
						</div>
					</div><!-- end row-->

					<div class="row">
						<div class="col-xs-12 col-sm-12 col-md-12 col-lg-6 col-xl-6">
							<div class="card mb-3">
								<div class="card-header">
									<h3><i class="fa fa-line-chart"></i> Open Findings by Severity over Time</h3>
								</div>
								<div class="card-body">
									<canvas id="chartTrendSeverity"></canvas>
								</div>
								<button type="button" onclick="downloadChart('chartTrendSeverity');"
									style="width: 100%; text-align: center;" title="Save this chart as a JPG"
									class="btn btn-info btn-sm"><span class="btn-label"><i
											class="fa fa-download"></i></span> Save Chart</button>
							</div><!-- end card-->
						</div>
						<div class="col-xs-12 col-sm-12 col-md-12 col-lg-6 col-xl-6">
							<div class="card mb-3">
								<div class="card-header">
									<h3><i class="fa fa-bar-chart"></i> New / Resolved / Persisting per Scan</h3>
								</div>
								<div class="card-body">
									<canvas id="chartTrendDeltas"></canvas>
								</div>
								<button type="button" onclick="downloadChart('chartTrendDeltas');"
									style="width: 100%; text-align: center;" title="Save this chart as a JPG"
									class="btn btn-info btn-sm"><span class="btn-label"><i
											class="fa fa-download"></i></span> Save Chart</button>
							</div><!-- end card-->
						</div>
					</div><!-- end row-->
				</div>
				<!-- END container-fluid -->
			</div>
			<!-- END content -->
		</div>
		<!-- END content-page -->

		<footer class="footer">
			<div id="includeFooterLink"></div>
		</footer>
		<div id="includeAutoLogin"></div>

	</div>
	<!-- END main -->

	<script src="/assets/js/modernizr.min.js"></script>
	<script src="/assets/js/jquery.min.js"></script>
	<script src="/assets/js/moment.min.js"></script>

	<script src="/assets/js/popper.min.js"></script>
	<script src="/assets/js/bootstrap.min.js"></script>

	<script src="/assets/js/detect.js"></script>
	<script src="/assets/js/fastclick.js"></script>
	<script src="/assets/js/jquery.blockUI.js"></script>
	<script src="/assets/js/jquery.nicescroll.js"></script>

	<!-- App js -->
	<script src="/assets/js/pikeadmin.js"></script>
	<script src="/js/openrmf.js"></script>
	<script src="/js/apis.js"></script>
	<script src="/assets/plugins/sweetalert/sweetalert.js"></script>

	<!-- BEGIN Java Script for this page -->
	<script src="/assets/plugins/chart.js/chart.min.js"></script>

	<script>
		var chartSeverity = null;
		var chartDeltas = null;

		async function getScanTrendReport() {
			var systemGroupId = $("#checklistSystemFilter").val();
			if (!systemGroupId || systemGroupId.length == 0) {
				swal("Please choose a system package for the report.", "Click OK to continue!", "error");
				return;
			}
			$.blockUI({ message: "Generating the Vulnerability Trend charts...please wait", css: { padding: '15px' } });
			let response = await fetch(scanhistoryAPI + "scan/" + encodeURIComponent(systemGroupId) + "/trend?scanType=nessus", {
				headers: { 'Authorization': 'Bearer ' + keycloak.token }
			});
			if (response.ok) {
				var data = await response.json();
				if (!data || data.length == 0) {
					$.unblockUI();
					swal("There are no scan snapshots for that system package yet. Upload a Nessus scan file first.", "Click OK to continue!", "warning");
					return;
				}
				renderTrendCharts(data);
			} else {
				swal("There was a problem loading the trend data.", "Click OK to continue!", "error");
			}
			$.unblockUI();
		}

		function renderTrendCharts(data) {
			var labels = data.map(function (s) { return moment(s.created).format("MM/DD/YY HH:mm"); });

			if (chartSeverity) chartSeverity.destroy();
			chartSeverity = new Chart(document.getElementById("chartTrendSeverity").getContext('2d'), {
				type: 'line',
				data: {
					labels: labels,
					datasets: [
						{ label: 'Critical', data: data.map(function (s) { return s.totalCritical; }), borderColor: 'rgba(255, 99, 132, 1)', backgroundColor: 'rgba(255, 99, 132, 0.2)', fill: false },
						{ label: 'High', data: data.map(function (s) { return s.totalHigh; }), borderColor: 'rgba(255, 153, 0, 1)', backgroundColor: 'rgba(255, 153, 0, 0.2)', fill: false },
						{ label: 'Medium', data: data.map(function (s) { return s.totalMedium; }), borderColor: 'rgba(216, 216, 14, 1)', backgroundColor: 'rgba(216, 216, 14, 0.2)', fill: false },
						{ label: 'Low', data: data.map(function (s) { return s.totalLow; }), borderColor: 'rgba(0, 204, 0, 1)', backgroundColor: 'rgba(0, 204, 0, 0.2)', fill: false }
					]
				},
				options: {
					responsive: true,
					legend: { display: true, position: 'bottom' },
					scales: { yAxes: [{ ticks: { beginAtZero: true } }] }
				}
			});

			if (chartDeltas) chartDeltas.destroy();
			chartDeltas = new Chart(document.getElementById("chartTrendDeltas").getContext('2d'), {
				type: 'bar',
				data: {
					labels: labels,
					datasets: [
						{ label: 'New', data: data.map(function (s) { return s.newFindings; }), backgroundColor: 'rgba(255, 99, 132, 0.8)' },
						{ label: 'Resolved', data: data.map(function (s) { return s.resolvedFindings; }), backgroundColor: 'rgba(0, 204, 0, 0.8)' },
						{ label: 'Persisting', data: data.map(function (s) { return s.persistingFindings; }), backgroundColor: 'rgba(150, 150, 150, 0.8)' }
					]
				},
				options: {
					responsive: true,
					legend: { display: true, position: 'bottom' },
					scales: { yAxes: [{ ticks: { beginAtZero: true } }] }
				}
			});
		}

		$(document).ready(function () {
			// authentication first
			keycloak.init({ onLoad: 'login-required' }).then(function (authenticated) {
				if (authenticated) {
					// setup the User Interface
					setupOpenRMFUI();
					getChecklistSystemsForReportFilter();
				}
				else {
					alert('You are not logged in. Please check your setup with Keycloak.');
				}
			}).catch(function () {
				alert('Keycloak did not respond correctly. Please verify your Keycloak realm as well as Redirect URI and Web Origins information. (i.e. are you missing an \'*\' somewhere?');
			});
		});
	</script>
	<!-- END Java Script for this page -->

</body>

</html>
