	<!-- BEGIN Java Script for this page -->
	<script>
		var tablePoam = null;
		var poamItemsById = {};
		var editingIsNew = false;

		function poamSeverityBadge(rawSeverity) {
			var sev = (rawSeverity || "").toLowerCase();
			if (sev == "critical" || sev == "high")
				return '<span style="padding: 5px;" class="vulnOpenCAT1">' + htmlEscape(rawSeverity) + '</span>';
			if (sev == "medium")
				return '<span style="padding: 5px;" class="vulnOpenCAT2">' + htmlEscape(rawSeverity) + '</span>';
			if (sev == "low")
				return '<span style="padding: 5px;" class="vulnOpenCAT3">' + htmlEscape(rawSeverity) + '</span>';
			return htmlEscape(rawSeverity || "");
		}

		async function getPoamItems() {
			var systemGroupId = $("#checklistSystemFilter").val();
			if (!systemGroupId || systemGroupId.length == 0) {
				swal("Please choose a system package.", "Click OK to continue!", "error");
				return;
			}
			$.blockUI({ message: "Loading the POA&M items...please wait", css: { padding: '15px' } });
			var url = poamAPI + "poam/system/" + encodeURIComponent(systemGroupId);
			var status = $("#poamStatusFilter").val();
			if (status) url += "?status=" + encodeURIComponent(status);
			let response = await fetch(url, { headers: { 'Authorization': 'Bearer ' + keycloak.token } });
			if (response.ok) {
				var data = await response.json();
				poamItemsById = {};
				data.forEach(function (item) { poamItemsById[item.internalIdString] = item; });
				tablePoam.clear();
				tablePoam.rows.add(data).draw();
			} else {
				swal("There was a problem loading the POA&M items.", "Click OK to continue!", "error");
			}
			$.unblockUI();
		}

		function newPoamItem() {
			var systemGroupId = $("#checklistSystemFilter").val();
			if (!systemGroupId || systemGroupId.length == 0) {
				swal("Please choose a system package first.", "Click OK to continue!", "error");
				return;
			}
			editingIsNew = true;
			$("#frmPoamId").val("");
			$("#poamEditModalTitle").text("New Manual POA&M Item");
			$("#grpPoamTitle").show();
			$("#frmPoamTitle").val("");
			$("#frmPoamStatus").val("Draft");
			$("#frmPoamScheduled").val("");
			$("#frmPoamSecurityControl").val("");
			$("#frmPoamOfficeOrg").val("");
			$("#frmPoamMilestones").val("");
			$("#frmPoamMilestoneChanges").val("");
			$("#frmPoamMitigations").val("");
			$("#frmPoamResources").val("");
			$("#frmPoamComments").val("");
			$("#frmPoamResidualRisk").val("");
			$("#frmPoamLikelihood").val("");
			$("#frmPoamImpact").val("");
			$("#frmPoamImpactDescription").val("");
			$("#frmPoamRecommendations").val("");
			$("#poamEditModal").modal("show");
		}

		function editPoamItem(id) {
			var item = poamItemsById[id];
			if (!item) return;
			editingIsNew = false;
			$("#frmPoamId").val(id);
			$("#poamEditModalTitle").text("Edit POA&M Item");
			if (item.isManual) { $("#grpPoamTitle").show(); } else { $("#grpPoamTitle").hide(); }
			$("#frmPoamTitle").val(item.title || "");
			$("#frmPoamStatus").val(item.status || "Draft");
			$("#frmPoamScheduled").val(item.scheduledCompletionDate ? moment(item.scheduledCompletionDate).format("YYYY-MM-DD") : "");
			$("#frmPoamSecurityControl").val(item.securityControl || "");
			$("#frmPoamOfficeOrg").val(item.officeOrg || "");
			$("#frmPoamMilestones").val(item.milestones || "");
			$("#frmPoamMilestoneChanges").val(item.milestoneChanges || "");
			$("#frmPoamMitigations").val(item.mitigations || "");
			$("#frmPoamResources").val(item.resources || "");
			$("#frmPoamComments").val(item.comments || "");
			$("#frmPoamResidualRisk").val(item.residualRiskLevel || "");
			$("#frmPoamLikelihood").val(item.likelihood || "");
			$("#frmPoamImpact").val(item.impact || "");
			$("#frmPoamImpactDescription").val(item.impactDescription || "");
			$("#frmPoamRecommendations").val(item.recommendations || "");
			$("#poamEditModal").modal("show");
		}

		async function savePoamItem() {
			var body = {
				title: $("#frmPoamTitle").val(),
				status: $("#frmPoamStatus").val(),
				scheduledCompletionDate: $("#frmPoamScheduled").val() ? $("#frmPoamScheduled").val() : null,
				securityControl: $("#frmPoamSecurityControl").val(),
				officeOrg: $("#frmPoamOfficeOrg").val(),
				milestones: $("#frmPoamMilestones").val(),
				milestoneChanges: $("#frmPoamMilestoneChanges").val(),
				mitigations: $("#frmPoamMitigations").val(),
				resources: $("#frmPoamResources").val(),
				comments: $("#frmPoamComments").val(),
				residualRiskLevel: $("#frmPoamResidualRisk").val(),
				likelihood: $("#frmPoamLikelihood").val(),
				impact: $("#frmPoamImpact").val(),
				impactDescription: $("#frmPoamImpactDescription").val(),
				recommendations: $("#frmPoamRecommendations").val()
			};
			var url, method;
			if (editingIsNew) {
				url = poamAPI + "poam/system/" + encodeURIComponent($("#checklistSystemFilter").val());
				method = "POST";
			} else {
				url = poamAPI + "poam/" + encodeURIComponent($("#frmPoamId").val());
				method = "PUT";
			}
			let response = await fetch(url, {
				method: method,
				headers: {
					'Authorization': 'Bearer ' + keycloak.token,
					'Content-Type': 'application/json'
				},
				body: JSON.stringify(body)
			});
			if (response.ok) {
				$("#poamEditModal").modal("hide");
				swal("The POA&M item was saved.", "Click OK to continue!", "success");
				getPoamItems();
			} else {
				swal("There was a problem saving the POA&M item.", "Click OK to continue!", "error");
			}
		}

		function exportPoamRecord() {
			var systemGroupId = $("#checklistSystemFilter").val();
			if (!systemGroupId || systemGroupId.length == 0) {
				swal("Please choose a system package.", "Click OK to continue!", "error");
				return;
			}
			$.blockUI({ message: "Generating the POA&M Excel export...please wait", css: { padding: '15px' } });
			var url = poamAPI + "poam/system/" + encodeURIComponent(systemGroupId) + "/export";
			var request = new XMLHttpRequest();
			request.open('GET', url, true);
			request.setRequestHeader('Authorization', 'Bearer ' + keycloak.token);
			request.responseType = 'blob';
			request.onload = function (e) {
				if (this.status === 200) {
					var blob = this.response;
					var downloadLink = window.document.createElement('a');
					var contentTypeHeader = request.getResponseHeader("Content-Type");
					var d = new Date();
					var strDate = d.getFullYear().toString() + "-" + (d.getMonth() + 1).toString() + "-" + d.getDate().toString() + "-" + d.getHours().toString() + "-" + d.getMinutes().toString() + "-" + d.getSeconds().toString();
					downloadLink.href = window.URL.createObjectURL(new Blob([blob], { type: contentTypeHeader }));
					downloadLink.download = "POAM-" + strDate + ".xlsx";
					document.body.appendChild(downloadLink);
					downloadLink.click();
					document.body.removeChild(downloadLink);
				} else {
					alert("There was a problem exporting your POA&M.")
				}
				$.unblockUI();
			};
			request.send();
		}

		$(document).ready(function () {
			// authentication first
			keycloak.init({ onLoad: 'login-required' }).then(function (authenticated) {
				if (authenticated) {
					// setup the User Interface
					setupOpenRMFUI();
					getChecklistSystemsForReportFilter();
					if (canUpload()) $("#btnNewPoamItem").show();

					tablePoam = $('#tblPoamItems').DataTable({
						"responsive": false,
						"searching": true,
						"pageLength": 25,
						"autoWidth": false,
						"deferRender": true,
						"data": [],
						"columns": [
							{ "data": null, "render": function (data) { return htmlEscape(data.title || ""); } },
							{ "data": null, "render": function (data) { return htmlEscape(data.hostname || ""); } },
							{ "data": null, "render": function (data) { return htmlEscape(data.sourceType || "") + (data.vulnId ? " " + htmlEscape(data.vulnId) : (data.pluginId ? " " + htmlEscape(data.pluginId) : "")); } },
							{ "data": null, "className": 'text-center', "render": function (data) { return poamSeverityBadge(data.rawSeverity); } },
							{ "data": null, "render": function (data) { return htmlEscape(data.status || ""); } },
							{ "data": null, "render": function (data) { return data.scheduledCompletionDate ? moment(data.scheduledCompletionDate).format("MM/DD/YYYY") : ""; } },
							{ "data": null, "render": function (data) { return data.firstSeen ? moment(data.firstSeen).format("MM/DD/YYYY") : ""; } },
							{ "data": null, "render": function (data) { return data.lastSeen ? moment(data.lastSeen).format("MM/DD/YYYY") : ""; } },
							{
								"data": null, "orderable": false, "className": 'text-center',
								"render": function (data) {
									if (canUpload())
										return '<button type="button" class="btn btn-sm btn-primary" title="Edit this POA&M item" onclick="editPoamItem(\'' + data.internalIdString + '\');"><i class="fa fa-pencil"></i></button>';
									return '';
								}
							}
						],
						"columnDefs": [
							{ "width": "30%", "targets": 0 },
							{ "width": "10%", "targets": 1 },
							{ "width": "12%", "targets": 2 },
							{ "width": "8%", "targets": 3 },
							{ "width": "14%", "targets": 4 },
							{ "width": "8%", "targets": 5 },
							{ "width": "8%", "targets": 6 },
							{ "width": "8%", "targets": 7 },
							{ "width": "5%", "targets": 8 }
						],
						order: [[3, 'asc']]
					});
				}
				else {
					alert('You are not logged in. Please check your setup with Keycloak.');
				}
			}).catch(function () {
				alert('Keycloak did not respond correctly. Please verify your Keycloak realm as well as Redirect URI and Web Origins information. (i.e. are you missing an \'*\' somewhere?');
			});
		});
	</script>
	<!-- END Java Script for this page -->

</body>
